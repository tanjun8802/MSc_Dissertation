[project]
name = "MSc_Dissertation"
description = "Dependency summary for the MSc dissertation RL codebase."
python = ">=3.10"

[dependencies]
# Required to run the core Python modules and experiment scripts.
runtime = [
  "numpy",
  "PyYAML",
]

# Required for plotting in compare_approaches.py and notebook visualisations.
visualization = [
  "matplotlib",
]

# Required for notebook-based evaluation and CSV analysis.
notebooks = [
  "pandas",
]

[notes]
standard_library_only_modules = [
  "argparse",
  "collections",
  "csv",
  "dataclasses",
  "os",
  "pathlib",
  "sys",
  "time",
  "typing",
  "warnings",
]
