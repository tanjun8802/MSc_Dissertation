[project]
name = "MSc_Dissertation"
version = "0.1.0"
description = "Dependency summary for the MSc dissertation RL codebase."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "matplotlib-inline >= 0.2",
  "pandas>=2.2",
  "torch>=2.11",
  "gymnasium>=0.29",
  "mujoco>=3.1",
  "robosuite>=1.5",
  "imageio>=2.37",
  "gymnasium[classic_control]",
  "pytest>=9.0.3",
  "dm-control>=1.0.43",
  "ogbench>=1.2.1",
  "ipython",
  "ipykernel",
]

[tool.setuptools.packages.find]
exclude = ["papers*", "src*"]

dev = []