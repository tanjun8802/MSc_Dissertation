[project]
name = "MSc_Dissertation"
version = "0.1.0"
description = "Dependency summary for the MSc dissertation RL codebase."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[project.optional-dependencies]
sim_stack = [
  "gymnasium>=0.29",
  "mujoco>=3.1",
  "robosuite>=1.5",
]

[tool.setuptools.packages.find]
exclude = ["papers*", "sandbox*"]

[dependency-groups]
dev = []