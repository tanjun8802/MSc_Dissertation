[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbtrl"
version = "0.2.0"
description = "Task-based transfer reinforcement learning research experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "torch>=2.11", "gymnasium>=1.0"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8"]

[project.scripts]
tbtrl = "tbtrl.experiments.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "build>=1", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tbtrl.environments" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# Preserve the user's committed result notebooks byte-for-byte. Their cells are
# still executed in fresh kernels in CI; new source notebooks remain linted.
extend-exclude = ["experiments/working/TBTRL_GridworldMaze_DQN.ipynb", "experiments/working/TBTRL_GridworldMaze_SAC.ipynb", "experiments/working/TBTRL_GridworldMaze_SAC_FactorisedActor.ipynb"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
