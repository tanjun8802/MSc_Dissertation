name: TBTRL checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discovery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Download discovery notebooks from Git LFS
        run: git lfs pull --include="experiments/working/TBTRL_PMO_*.ipynb,experiments/working/TBTRL_MADE_*.ipynb" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - name: Install optional discovery dependencies and pinned native MADE
        run: |
          uv sync --locked --group dev --extra pmo --extra materials
          uv pip install --python .venv/bin/python --no-deps 'made @ git+https://github.com/diffractivelabs/MADE.git@bffda0c9a1fa1904b35c0ef67b455881c975df86'
      - name: Check native interfaces, budgets and candidate replay
        run: .venv/bin/python -m pytest tests/test_discovery.py
      - name: Execute discovery notebooks with offline smoke budgets
        run: .venv/bin/python scripts/check_discovery_notebooks.py

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      MUJOCO_GL: egl
      TBTRL_TEST_RENDER: "1"
      TBTRL_RENDER_ARTIFACTS: ${{ runner.temp }}/fetch-previews
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download working notebooks from Git LFS
        run: git lfs pull --include="experiments/working/*.ipynb" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install locked development environment
        run: uv sync --locked --group dev --extra robotics
      - name: Install headless graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Lint and format
        run: |
          uv run --extra robotics ruff check .
          uv run --extra robotics ruff format --check .
      - name: Test replay, TBTRL updates and experiment pipelines
        run: uv run --extra robotics pytest
      - name: Save Fetch smoke render previews
        uses: actions/upload-artifact@v4
        with:
          name: fetch-smoke-previews
          path: ${{ runner.temp }}/fetch-previews
      - name: Audit configurations against original notebook calls
        run: uv run --extra robotics python scripts/verify_notebook_configs.py
      - name: Check update equivalence with original trainers
        run: uv run --extra robotics python scripts/verify_legacy_equivalence.py
      - name: Execute supported notebooks in fresh kernels
        run: uv run --extra robotics python scripts/check_notebooks.py
      - name: Build wheel and source distribution
        run: uv run --extra robotics python -m build
      - name: Verify wheel imports outside the checkout
        run: |
          uv venv /tmp/tbtrl-wheel
          uv pip install --python /tmp/tbtrl-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/tbtrl-wheel/bin/python -c "from tbtrl.training.dqn import train_dqn; from tbtrl.training.sac import train_sac; from tbtrl.environments.registry import make_environment; make_environment('maze-discrete', [1, 1]).close()"
