# configs/rcrl.yaml
# =================
# Configuration for Reward-Conditioned RL (RCRL).
#
# Reference:
#   "Reward-Conditioned Reinforcement Learning" (Nauman, Cygan & Abbeel, 2026)
#   arXiv:2603.05066
#
# Key insight: conditioning the policy and Q-function on a reward
# parameterisation ψ — rather than on a fixed reward function — lets a
# single agent learn to optimise a *family* of reward specifications while
# only interacting with the environment under the nominal task.  Training
# with diverse ψ sampled from PΨ = α·δ(ψ*) + (1−α)·pΨ improves sample
# efficiency under ψ* and enables zero-shot adaptation to alternative
# reward functions.

# ------ Environment -------------------------------------------------------
env:
  name: GridWorld
  height: 5
  width: 5
  start_pos: [0, 0]
  goal_pos: [4, 4]        # [row, col] of the reward-giving goal cell
  walls: []
  max_steps: 200

# ------ MDP ---------------------------------------------------------------
mdp:
  gamma: 0.99

# ------ Agent -------------------------------------------------------------
agent:
  name: RewardConditionedAgent
  n_psi_bins: 5           # discrete reward-parameterisation bins
  psi_min: -0.1           # most negative step-cost weight (bin n_psi_bins-1)
  psi_mix_alpha: 0.5      # fraction of nominal ψ* draws in the training mixture
  alpha: 0.1              # Q-learning step size
  epsilon: 1.0            # initial ε for ε-greedy exploration
  epsilon_min: 0.05       # minimum ε (used during exploitation phase)
  epsilon_decay: 0.995    # multiplicative decay per episode

# ------ Training (two-phase) ----------------------------------------------
training:
  explore_episodes: 400   # Phase 1: Q-learning with diverse ψ sampling
  exploit_episodes: 100   # Phase 2: greedy evaluation under ψ*
  seed: 42

# ------ Logging -----------------------------------------------------------
logging:
  log_dir: logs/rcrl
  verbose: true
