# configs/default.yaml
# ====================
# Default configuration for RL experiments.
#
# Override individual keys from the CLI or by loading a custom YAML file
# and merging it with this default.
#
# NOTE: This config is shared by compare_approaches.py.  A 5×5 grid with
# 300 episodes is the right size for the quick comparison; for a full-scale
# run use the algorithm-specific configs (rcrl.yaml / gcrl.yaml) which target
# a 15×15 grid with 1000 episodes.

# ------ Environment -------------------------------------------------------
env:
  name: GridWorld          # environment class name (see environments/)
  height: 10
  width: 10
  start_pos: [0, 0]        # [row, col]
  goal_pos: [9, 9]         # null = reward-free mode (no terminal goal)
  walls: []                # list of [row, col] wall positions
  max_steps: 800          # episode time limit (null = unlimited)

# ------ MDP ---------------------------------------------------------------
mdp:
  gamma: 0.99              # discount factor γ
  reward_free: false       # set true to run reward-free exploration phase

# ------ Agent -------------------------------------------------------------
agent:
  name: RandomAgent        # agent class name (see agents/)
  # Q-learning / TD hyperparameters (used by concrete agents)
  alpha: 0.1               # learning rate
  temperature: 1.0         # softmax temperature for GCRL
  target_entropy: 0.0      # anneal the GCRL actor toward deterministic actions
  min_temperature: 1.0e-6  # softmax analogue of a minimum actor std
  n_negatives: 16          # negative future-state examples per GCRL update
  logsumexp_reg: 0.01      # GCRL LogSumExp regularisation coefficient
  buffer_capacity: 10000   # replay capacity for GCRL
  samples_per_insert: 256  # replay ratio for GCRL
  n_critic_updates: 10     # legacy minimum number of GCRL critic batches
  epsilon: 1.0             # initial ε for ε-greedy exploration
  epsilon_min: 0.05        # minimum ε after decay
  epsilon_decay: 0.995    # multiplicative decay per episode

# ------ Training ----------------------------------------------------------
training:
  n_episodes: 300         # total training episodes
  eval_every: 50          # evaluate every N episodes (0 = disabled)
  seed: 42

# ------ Replay buffer -----------------------------------------------------
replay_buffer:
  capacity: 100000         # maximum number of stored transitions
  batch_size: 64           # mini-batch size for off-policy updates
  min_size: 1000           # start learning only after this many transitions

# ------ Logging -----------------------------------------------------------
logging:
  log_dir: logs            # directory for CSV / checkpoint output
  verbose: true            # print episode summaries to stdout
